name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  # Pinned scanner/SBOM tool versions, installed in an isolated venv so they never enter the app lock.
  PIP_AUDIT_VERSION: "2.10.1"
  CYCLONEDX_BOM_VERSION: "7.5.0"

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install from lock (source of truth) and the project without resolving
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements-dev.lock
          .venv/bin/pip install --no-deps -e .
      - name: Lock check (consistent env, locks match pyproject)
        run: |
          .venv/bin/pip check
          .venv/bin/python scripts/lock.py --check
      - name: Ruff (includes S security rules)
        run: .venv/bin/ruff check src tests
      - name: Trust boundary (import-linter)
        run: .venv/bin/lint-imports
      - name: Tests (includes adversarial suite)
        run: .venv/bin/pytest -q
      - name: Adversarial suite explicitly
        run: .venv/bin/pytest -q tests/adversarial
      - name: Migrations are in sync with models
        run: .venv/bin/alembic upgrade head && .venv/bin/alembic check
        env:
          DATABASE_URL: sqlite+aiosqlite:///./ci.db
      - name: Bandit
        run: .venv/bin/bandit -q -r src -c pyproject.toml
      - name: Install scanners (isolated venv)
        run: |
          python -m venv .tools
          .tools/bin/pip install "pip-audit==${PIP_AUDIT_VERSION}" "cyclonedx-bom==${CYCLONEDX_BOM_VERSION}"
      - name: pip-audit (locked dependency set)
        run: .tools/bin/pip-audit -r requirements-dev.lock --no-deps --disable-pip
      - name: SBOM (CycloneDX, Python runtime)
        run: |
          .tools/bin/cyclonedx-py requirements requirements.lock --of JSON -o sbom-python.cdx.json
      - uses: actions/upload-artifact@v7
        with:
          name: sbom-python
          path: sbom-python.cdx.json

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm test
      - name: npm audit (fail on high or critical)
        run: npm audit --audit-level=high
      - name: SBOM (CycloneDX, npm production deps)
        run: npm sbom --sbom-format cyclonedx --omit dev > sbom-npm.cdx.json
      - uses: actions/upload-artifact@v7
        with:
          name: sbom-npm
          path: web/sbom-npm.cdx.json
