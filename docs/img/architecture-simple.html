<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#fff}svg text{font-family:-apple-system,Helvetica,Arial,sans-serif}
.t{font-size:16px;fill:#1f2937}.s{font-size:13px;fill:#4b5563}.b{font-weight:700}</style></head><body>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker></defs>
<rect width="1600" height="960" fill="#fff"/>
<text x="800" y="48" text-anchor="middle" style="font-size:30px;font-weight:700;fill:#111827">SourceLoop — AI agents that source a part end to end, safely</text>
<text x="800" y="76" text-anchor="middle" class="s" style="font-size:15px">SAP Business Network · Supplier Diversification &amp; Lifecycle Management · prototype on synthetic data</text>

<!-- process chevrons -->
<g class="t b" style="font-size:17px">
<polygon points="60,104 400,104 430,152 400,200 60,200 90,152" fill="#dbeafe" stroke="#3b82f6"/><text x="245" y="146" text-anchor="middle">1 · Discover</text><text x="245" y="170" text-anchor="middle" class="s" style="font-weight:400">find candidate suppliers</text>
<polygon points="440,104 780,104 810,152 780,200 440,200 470,152" fill="#e0e7ff" stroke="#6366f1"/><text x="625" y="146" text-anchor="middle">2 · Qualify</text><text x="625" y="170" text-anchor="middle" class="s" style="font-weight:400">compliance, certificates, risk</text>
<polygon points="820,104 1160,104 1190,152 1160,200 820,200 850,152" fill="#ede9fe" stroke="#8b5cf6"/><text x="1005" y="146" text-anchor="middle">3 · Source</text><text x="1005" y="170" text-anchor="middle" class="s" style="font-weight:400">quote request &amp; negotiation</text>
<polygon points="1200,104 1540,104 1540,200 1200,200 1230,152" fill="#fae8ff" stroke="#c026d3"/><text x="1385" y="146" text-anchor="middle">4 · Contract</text><text x="1385" y="170" text-anchor="middle" class="s" style="font-weight:400">clauses, award, hand-off</text>
</g>

<!-- three actors -->
<rect x="60" y="250" width="400" height="260" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
<text x="260" y="286" text-anchor="middle" class="t b" style="font-size:20px">Buyer's AI agent</text>
<text x="260" y="312" text-anchor="middle" class="s">works for the buying company</text>
<rect x="90" y="332" width="340" height="62" rx="8" fill="#fff" stroke="#93c5fd"/><text x="260" y="356" text-anchor="middle" class="t">Specialist helpers</text><text x="260" y="378" text-anchor="middle" class="s">screening · cost · news &amp; weather risk</text>
<rect x="90" y="410" width="340" height="80" rx="8" fill="#fef2f2" stroke="#f87171"/><text x="260" y="436" text-anchor="middle" class="t b">🔒 Private limits</text><text x="260" y="458" text-anchor="middle" class="s">max price · lead time · excluded countries</text><text x="260" y="476" text-anchor="middle" class="s">never visible to the supplier</text>

<rect x="1140" y="250" width="400" height="260" rx="14" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
<text x="1340" y="286" text-anchor="middle" class="t b" style="font-size:20px">Supplier's AI agent</text>
<text x="1340" y="312" text-anchor="middle" class="s">works for the supplier</text>
<rect x="1170" y="332" width="340" height="62" rx="8" fill="#fff" stroke="#86efac"/><text x="1340" y="356" text-anchor="middle" class="t">Specialist helpers</text><text x="1340" y="378" text-anchor="middle" class="s">quotes · capacity · documents</text>
<rect x="1170" y="410" width="340" height="80" rx="8" fill="#fef2f2" stroke="#f87171"/><text x="1340" y="436" text-anchor="middle" class="t b">🔒 Private limits</text><text x="1340" y="458" text-anchor="middle" class="s">price floor · capacity · lead time</text><text x="1340" y="476" text-anchor="middle" class="s">never visible to the buyer</text>

<rect x="560" y="236" width="480" height="290" rx="16" fill="#111827"/>
<text x="800" y="274" text-anchor="middle" style="font-size:21px;font-weight:700;fill:#fff">SBN trust layer</text>
<text x="800" y="298" text-anchor="middle" style="font-size:14px;fill:#cbd5e1">a neutral, rule-based referee — not an AI</text>
<g style="font-size:15px;fill:#fff">
<rect x="584" y="318" width="432" height="52" rx="8" fill="#1f2937"/><text x="600" y="340">✔ Enforces each side's limits</text><text x="600" y="358" style="font-size:12px;fill:#9ca3af">in software, so a prompt can't talk its way past them</text>
<rect x="584" y="380" width="432" height="52" rx="8" fill="#1f2937"/><text x="600" y="402">✔ Runs the process and the messages</text><text x="600" y="420" style="font-size:12px;fill:#9ca3af">signed messages, fixed stages, bounded negotiation</text>
<rect x="584" y="442" width="432" height="68" rx="8" fill="#1f2937"/><text x="600" y="464">✔ Records everything, tamper-evident</text><text x="600" y="482" style="font-size:12px;fill:#9ca3af">hash-chained audit log; pauses for a human at key decisions</text><text x="600" y="498" style="font-size:12px;fill:#9ca3af">and shares only pass / fail, never the other side's numbers</text>
</g>
<line x1="462" y1="380" x2="558" y2="380" stroke="#334155" stroke-width="2.5" marker-end="url(#a)" marker-start="url(#a)"/>
<line x1="1042" y1="380" x2="1138" y2="380" stroke="#334155" stroke-width="2.5" marker-end="url(#a)" marker-start="url(#a)"/>

<!-- humans -->
<rect x="60" y="570" width="1480" height="130" rx="14" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
<text x="800" y="604" text-anchor="middle" class="t b" style="font-size:19px">People stay in control — the agents pause and ask at every high-stakes decision</text>
<g class="t" style="font-size:14px">
<rect x="84" y="624" width="216" height="58" rx="8" fill="#fff" stroke="#fbbf24"/><text x="192" y="648" text-anchor="middle" class="b">Compliance</text><text x="192" y="668" text-anchor="middle" class="s">screening flags</text>
<rect x="312" y="624" width="216" height="58" rx="8" fill="#fff" stroke="#fbbf24"/><text x="420" y="648" text-anchor="middle" class="b">Quality</text><text x="420" y="668" text-anchor="middle" class="s">technical pass / fail</text>
<rect x="540" y="624" width="216" height="58" rx="8" fill="#fff" stroke="#fbbf24"/><text x="648" y="648" text-anchor="middle" class="b">Buyer</text><text x="648" y="668" text-anchor="middle" class="s">award decision</text>
<rect x="768" y="624" width="216" height="58" rx="8" fill="#fff" stroke="#fbbf24"/><text x="876" y="648" text-anchor="middle" class="b">Legal</text><text x="876" y="668" text-anchor="middle" class="s">protected contract clauses</text>
<rect x="996" y="624" width="216" height="58" rx="8" fill="#fff" stroke="#fbbf24"/><text x="1104" y="648" text-anchor="middle" class="b">Finance</text><text x="1104" y="668" text-anchor="middle" class="s">bank details · payment release</text>
<rect x="1224" y="624" width="292" height="58" rx="8" fill="#fff" stroke="#fbbf24"/><text x="1370" y="648" text-anchor="middle" class="b">Approve · edit · reject</text><text x="1370" y="668" text-anchor="middle" class="s">every decision is logged</text>
</g>
<line x1="800" y1="528" x2="800" y2="566" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>

<!-- value props -->
<g class="t">
<rect x="60" y="730" width="360" height="120" rx="12" fill="#f8fafc" stroke="#cbd5e1"/><text x="240" y="762" text-anchor="middle" class="b" style="font-size:17px">Safe by design</text><text x="240" y="788" text-anchor="middle" class="s">Limits live in code, not prompts.</text><text x="240" y="808" text-anchor="middle" class="s">External text is treated as untrusted.</text><text x="240" y="828" text-anchor="middle" class="s">Unknown or missing data fails closed.</text>
<rect x="440" y="730" width="360" height="120" rx="12" fill="#f8fafc" stroke="#cbd5e1"/><text x="620" y="762" text-anchor="middle" class="b" style="font-size:17px">Auditable</text><text x="620" y="788" text-anchor="middle" class="s">Every action is in a tamper-evident log.</text><text x="620" y="808" text-anchor="middle" class="s">Replays give the same decisions.</text><text x="620" y="828" text-anchor="middle" class="s">Exportable for review.</text>
<rect x="820" y="730" width="360" height="120" rx="12" fill="#f8fafc" stroke="#cbd5e1"/><text x="1000" y="762" text-anchor="middle" class="b" style="font-size:17px">No-code configurable</text><text x="1000" y="788" text-anchor="middle" class="s">Studio: models, prompts, rules, clauses</text><text x="1000" y="808" text-anchor="middle" class="s">and workflow set from the UI,</text><text x="1000" y="828" text-anchor="middle" class="s">versioned and rollback-able.</text>
<rect x="1200" y="730" width="340" height="120" rx="12" fill="#f8fafc" stroke="#cbd5e1"/><text x="1370" y="762" text-anchor="middle" class="b" style="font-size:17px">Runs anywhere</text><text x="1370" y="788" text-anchor="middle" class="s">Docker: web + API, one command.</text><text x="1370" y="808" text-anchor="middle" class="s">Local AI models via Ollama;</text><text x="1370" y="828" text-anchor="middle" class="s">no data leaves the machine.</text>
</g>
<text x="800" y="900" text-anchor="middle" class="s" style="font-size:14px">Result: a human-approved, fully logged supplier decision and contract draft — without human bottlenecks between the routine steps.</text>
<text x="800" y="930" text-anchor="middle" class="s" style="fill:#9ca3af">Detailed technical diagram: docs/img/architecture.png</text>
</svg></body></html>
