# SourceLoop: api (FastAPI, SQLite in a named volume) + web (nginx SPA, proxies /api). Ollama stays on the host.
# Host ports: web 3010 (open this), api 8005 (direct/debug). Container ports: api 8000, web 8080.
services:
  api:
    build: .
    ports:
      - "8005:8000"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: sqlite+aiosqlite:////data/sourceloop.db
      AUDIT_ANCHOR_PATH: /data/anchors/audit-anchors.jsonl
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - sl_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if b'ok' in urllib.request.urlopen('http://localhost:8000/api/v1/health').read() else 1)"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
  web:
    build: ./web
    ports:
      - "3010:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
volumes:
  sl_data:
