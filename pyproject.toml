[project]
name = "sourceloop"
version = "0.1.0"
description = "Agentic supplier sourcing prototype (SAP Business Network, Track 1)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9,<3",
  "sqlalchemy[asyncio]>=2.0.36,<3",
  "greenlet>=3.0",  # SQLAlchemy 2.1 no longer pulls it in via the asyncio extra; alembic/async engine need it
  "aiosqlite>=0.20",
  "alembic>=1.14,<2",
  "rapidfuzz>=3.10,<4",
  "httpx>=0.27",
  "argon2-cffi>=23.1,<26",
  "cryptography>=43,<51",
  "pyjwt>=2.9,<3",
  "structlog>=24.4,<27",
  "pyyaml>=6.0,<7",
  "slowapi>=0.1.9",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "pytest-cov>=5,<8", "ruff>=0.7", "bandit>=1.7", "import-linter>=2.0,<3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sourceloop"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["adversarial: red-team suite (tests/adversarial); offline and deterministic"]

[tool.ruff]
line-length = 110
src = ["src", "tests"]
[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP"]
ignore = ["S101", "E501", "UP046"]
[tool.ruff.lint.per-file-ignores]
"src/sourceloop/data/synthetic.py" = ["S311"]
"src/sourceloop/api/**" = ["B008"]  # FastAPI Depends()/Query() defaults
"tests/**" = ["S105", "S106"]

[tool.importlinter]
root_packages = ["sourceloop"]

[[tool.importlinter.contracts]]
name = "Agents may only use the bus client interface and agents.common (trust boundary)"
type = "forbidden"
source_modules = ["sourceloop.agents"]
forbidden_modules = [
  "sourceloop.data",
  "sourceloop.policy",
  "sourceloop.orchestrator",
  "sourceloop.compliance",
  "sourceloop.subagents",
  "sourceloop.studio",
  "sourceloop.audit.chain",
]
allow_indirect_imports = true
ignore_imports = ["sourceloop.agents.** -> sourceloop.data.enums"]

[tool.bandit]
# B101 (assert) and B311 (seeded random for simulation) are policed by ruff S101/S311 with explicit per-file ignores.
skips = ["B101", "B311"]
exclude_dirs = ["tests"]
